name: Kaguya Studio (Windows)

on:
  push:
    paths:
      - "KaguyaStudio/**"
      - ".github/workflows/kaguya-windows.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: KaguyaStudio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependências do Studio
        run: python -m pip install -r requirements.txt -r requirements-voz.txt pyinstaller pillow

      - name: CLIs oficiais (instaladas sem login, sem chaves)
        run: npm install -g @openai/codex @anthropic-ai/claude-code

      - name: Vozes neurais (download real pelo próprio Studio, com SHA-256)
        run: python -c "from pathlib import Path; from kaguya.voice.neural import NeuralVoices; v=NeuralVoices(Path('ci-modelos')); v.download(); print('instaladas:', v.installed())"

      - name: Testes automatizados (inclui CLIs reais sem conta)
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
          KAGUYA_TEST_REAL_CLIS: "1"
          KAGUYA_TEST_KOKORO_DIR: ci-modelos
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -t . -v

      - name: Capturas no Windows (100/125/150/200%)
        timeout-minutes: 10
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          New-Item -ItemType Directory -Force capturas | Out-Null
          python -m kaguya --demo --captura capturas/win_chat_100.png --tamanho 1366x740
          python -m kaguya --demo --captura capturas/win_chat_125.png --escala 1.25 --tamanho 1536x830 --flutuantes
          python -m kaguya --demo --captura capturas/win_chat_150.png --escala 1.5 --tamanho 1280x690
          python -m kaguya --demo --captura capturas/win_chat_200.png --escala 2 --tamanho 1920x1040
          python -m kaguya --demo --captura capturas/win_diag_100.png --pagina diag
          python -m kaguya --demo --captura capturas/win_memory_100.png --pagina memory
          Get-ChildItem capturas

      - name: Build do executável (PyInstaller)
        run: python tools/build_windows.py

      - name: Fumaça do executável (abre e renderiza Diagnóstico)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:KAGUYA_HOME = "$env:RUNNER_TEMP\kaguya-exe"
          $p = Start-Process -FilePath "dist\KaguyaStudio\KaguyaStudio.exe" -ArgumentList "--captura","capturas\win_exe_diag.png","--pagina","diag" -PassThru -Wait
          if (-not (Test-Path capturas\win_exe_diag.png)) { throw "executável não gerou a captura (código $($p.ExitCode))" }

      - name: Voz local dentro do executável (importa faster-whisper e o acesso ao microfone)
        shell: pwsh
        run: |
          $env:KAGUYA_HOME = "$env:RUNNER_TEMP\kaguya-voz"
          $p = Start-Process -FilePath "dist\KaguyaStudio\KaguyaStudio.exe" -ArgumentList "--verificar-voz" -PassThru -Wait
          Get-Content "$env:KAGUYA_HOME\logs\voz.txt"
          if ($p.ExitCode -ne 0) { throw "voz indisponível no executável (código $($p.ExitCode))" }

      - name: Controle do computador pelo executável (servidor MCP real, entrada e captura do Windows)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:KAGUYA_DESKTOP_DIR = "$env:RUNNER_TEMP\kaguya-desktop"
          $env:KAGUYA_DESKTOP_WINDOW = ""
          $env:PYTHONIOENCODING = "utf-8"
          python tools/checar_desktop_exe.py "dist\KaguyaStudio\KaguyaStudio.exe" capturas\win_desktop_mcp.png

      - name: Executável em modo normal (como o usuário abre), com dados da V3 para importar
        shell: pwsh
        run: |
          $base = "$env:RUNNER_TEMP\kaguya-normal"
          New-Item -ItemType Directory -Force "$base\lad\KaguyaStudioV3", "$base\proj", "$base\vault\.obsidian" | Out-Null
          python -c "import sqlite3,sys; d=sqlite3.connect(sys.argv[1]); d.executescript('CREATE TABLE projects(id INTEGER PRIMARY KEY, name TEXT, directory TEXT UNIQUE, vault TEXT, created_at TEXT); CREATE TABLE tasks(id INTEGER PRIMARY KEY, project_id INT, target TEXT, title TEXT, kind TEXT, status TEXT, created_at TEXT, allow_write INT, allow_web INT, started_at TEXT, finished_at TEXT, result TEXT);'); d.execute('INSERT INTO projects VALUES(1,?,?,?,?)', ('NarutoCD', sys.argv[2], sys.argv[3], 'x')); d.execute('INSERT INTO projects VALUES(2,?,?,?,?)', ('Ghoulcraft', 'Z:\\Projetos\\Ghoulcraft', 'Z:\\Segundo Cerebro', 'x')); d.commit()" "$base\lad\KaguyaStudioV3\studio.sqlite3" "$base\proj" "$base\vault"
          $env:LOCALAPPDATA = "$base\lad"
          $p = Start-Process -FilePath "dist\KaguyaStudio\KaguyaStudio.exe" -ArgumentList "--sair-apos","12" -PassThru
          if (-not $p.WaitForExit(90000)) { Write-Host "TRAVOU: processo não terminou em 90 s"; Stop-Process -Id $p.Id -Force; $code = 99 } else { $code = $p.ExitCode }
          Write-Host "---- inicializacao.log ----"; Get-Content "$base\lad\KaguyaStudio\logs\inicializacao.log" -ErrorAction SilentlyContinue
          Write-Host "---- erros.log ----"; Get-Content "$base\lad\KaguyaStudio\logs\erros.log" -ErrorAction SilentlyContinue
          Get-ChildItem "$base\lad\KaguyaStudio\logs" -Filter "travamento_*" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          Copy-Item "$base\lad\KaguyaStudio\logs" capturas\logs-modo-normal -Recurse -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "modo normal falhou (código $code)" }

      - name: Instalador (Inno Setup) — instalar, atualizar com o Studio aberto e desinstalar
        timeout-minutes: 25
        shell: pwsh
        run: |
          $v = python -c "import kaguya; print(kaguya.VERSION)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$v" "/DSourceDir=..\dist\KaguyaStudio" instalador\KaguyaStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }
          $setup = "dist\KaguyaStudio-Instalador-$v.exe"
          "{0:N0} MB" -f ((Get-Item $setup).Length / 1MB)
          $app = "$env:LOCALAPPDATA\Programs\Kaguya Studio\KaguyaStudio.exe"
          # 1) instalação nova, silenciosa, só para o usuário
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/LOG=$env:RUNNER_TEMP\inst1.log" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path $app)) { Get-Content "$env:RUNNER_TEMP\inst1.log" -Tail 40; throw "instalação falhou ($($p.ExitCode))" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Kaguya Studio.lnk")) { throw "atalho do menu Iniciar não criado" }
          # 2) atualização por cima com o Studio ABERTO (na bandeja): o instalador deve fechá-lo e trocar os arquivos
          $running = Start-Process $app -ArgumentList "--segundo-plano" -PassThru
          Start-Sleep -Seconds 12
          if ($running.HasExited) { throw "o Studio instalado não ficou aberto (código $($running.ExitCode))" }
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/LOG=$env:RUNNER_TEMP\inst2.log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\inst2.log" -Tail 60; throw "atualização falhou ($($p.ExitCode))" }
          if (-not $running.HasExited) { Stop-Process -Id $running.Id -Force; throw "o instalador não fechou o Studio aberto" }
          Write-Host "Studio aberto foi fechado pelo instalador (código $($running.ExitCode)) e a atualização concluiu"
          $data = "$env:LOCALAPPDATA\KaguyaStudio\studio.sqlite3"
          if (-not (Test-Path $data)) { throw "dados do usuário não encontrados" }
          # 3) desinstalar mantém os dados do usuário
          $unins = Get-ChildItem "$env:LOCALAPPDATA\Programs\Kaguya Studio" -Filter "unins*.exe" | Select-Object -First 1
          $p = Start-Process $unins.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $app) { throw "desinstalação deixou o programa" }
          if (-not (Test-Path $data)) { throw "desinstalação apagou os dados do usuário" }
          Write-Host "instalar, atualizar com o app aberto e desinstalar (mantendo dados): OK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-windows
          path: KaguyaStudio/capturas/

      - uses: actions/upload-artifact@v4
        with:
          name: KaguyaStudio-windows
          path: KaguyaStudio/dist/KaguyaStudio-*-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KaguyaStudio-Instalador
          path: KaguyaStudio/dist/KaguyaStudio-Instalador-*.exe
          compression-level: 0
